services:
  api:
    build: .
    command: sh -c "npm run seed && node dist/index.js"
    ports:
      - '3000:3000'
    # Listed explicitly instead of `env_file: .env` so the API container never
    # receives the OpenAI/Gmail secrets that only N8N needs.
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/dev.db
      - API_KEY=${API_KEY}
      - AVAILABILITY_CACHE_TTL_SECONDS=${AVAILABILITY_CACHE_TTL_SECONDS:-30}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_TIME_WINDOW_MS=${RATE_LIMIT_TIME_WINDOW_MS:-60000}
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    ports:
      - '5678:5678'
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=false
      - N8N_API_BASE_URL=http://api:3000
      - N8N_API_KEY=${API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Keep execution history so the Executions tab can be used to inspect runs.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:5678/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8080:8025'
      - '1025:1025'

volumes:
  api-data:
  n8n-data:
